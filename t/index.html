<title>TEES ONE</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans KR",sans-serif;background:#F2F5F3;color:#22322A;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:20px}</style>
</head><body>
<div id="m">…</div>
<script>
/* TEES ONE 출퇴근 카드 — 앱이 깔린 폰은 이 주소를 앱이 받아 열고(이 페이지는 안 열림),
   앱이 없는 폰은 여기서 사내 서버의 출퇴근 쪽으로 넘긴다. 카드의 비밀 코드는 # 뒤에 있어 이 서버(GitHub)로 보내지지 않는다. */
(function () {
  var h = (location.hash || "").replace(/^#/, "");
  var p = new URLSearchParams(h);
  var k = p.get("k") || "", t = p.get("t") || "work";
  if (!k) { document.getElementById("m").textContent = "TEES ONE"; return; }
  /* SERVERLIST (2026-10-21): 서버 주소는 /app/server.json 의 servers(앞에서부터 닿는 첫 곳). 못 읽으면 기본값. */
  var go = function (base) { location.replace(base.replace(/\/$/, "") + "/staff/punch?k=" + encodeURIComponent(k) + "&t=" + encodeURIComponent(t)); };
  var fallback = ["https://tees.tail97bb58.ts.net:10000", "https://tees.tail97bb58.ts.net"];
  var probe = function (list, i) {
    if (i >= list.length) { go(list[0]); return; }
    var done = false, timer = setTimeout(function () { if (!done) { done = true; probe(list, i + 1); } }, 3000);
    fetch(list[i].replace(/\/$/, "") + "/api/health", { mode: "no-cors", cache: "no-store" })
      .then(function () { if (!done) { done = true; clearTimeout(timer); go(list[i]); } }, function () { if (!done) { done = true; clearTimeout(timer); probe(list, i + 1); } });
  };
  fetch("/app/server.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) { var s = (j && j.servers || []).filter(function (x) { return /^https:\/\//.test(x); }); probe(s.length ? s : fallback, 0); })
    .catch(function () { probe(fallback, 0); });
})();
</script>
</body></html>
